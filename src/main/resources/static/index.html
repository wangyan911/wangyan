<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>西南大学附中器材室管理系统</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#1b2738;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}.head{background:#173f70;color:white;padding:18px max(18px,calc((100% - 1200px)/2));display:flex;justify-content:space-between;align-items:center}.head h1{font-size:21px;margin:0}.head small{color:#d7e5f3}.wrap{max-width:1200px;margin:22px auto;padding:0 16px}.login{max-width:390px;margin:9vh auto}.card{background:white;border:1px solid #e4e9f0;border-radius:10px;padding:17px;margin-bottom:15px;box-shadow:0 3px 12px #163a5a0a}.nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}.nav button,button{border:0;border-radius:6px;padding:9px 13px;background:#e6edf5;color:#174979;cursor:pointer;font-weight:600}.nav .on,button.primary{background:#1769aa;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px}input,select{width:100%;padding:10px;border:1px solid #ccd5e0;border-radius:6px;background:white}h2{font-size:17px;margin:0 0 13px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px;border-bottom:1px solid #edf0f3;white-space:nowrap}th{color:#68778a}.muted{color:#738197;font-size:12px}.msg{color:#b42318;min-height:20px;margin-top:8px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.stat{padding:15px;background:#f4f8fc;border-radius:8px}.stat b{display:block;font-size:24px;color:#1769aa}.hidden{display:none}.right{display:flex;align-items:center;gap:12px}
</style></head><body>
<header class="head"><div><h1>西南大学附中器材室管理系统</h1><small>局域网器材登记、借还、盘点与维修</small></div><div class="right"><span id="who"></span><button id="logout" class="hidden">退出</button></div></header>
<section id="loginView" class="login card"><h2>系统登录</h2><form id="loginForm" class="grid"><input name="username" placeholder="用户名" value="admin" required><input name="password" type="password" placeholder="密码" required><button class="primary">登录</button></form><div id="loginMsg" class="msg"></div><p class="muted">首次启动初始管理员：admin / ChangeMe-2026!；首次登录后请立即修改密码。</p></section>
<main id="app" class="wrap hidden"><nav id="nav" class="nav"></nav><section id="dashboard" class="view"></section><section id="equipment" class="view hidden"></section><section id="loans" class="view hidden"></section><section id="inventory" class="view hidden"></section><section id="repairs" class="view hidden"></section><section id="users" class="view hidden"></section><section id="categories" class="view hidden"></section></main>
<script>
let me=null, csrf='', categories=[], equipment=[];const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opt={}){let h={...(opt.headers||{})};if(csrf)h['X-CSRF-Token']=csrf;if(opt.body)h['Content-Type']='application/json';let r=await fetch(url,{...opt,headers:h});if(!r.ok){let msg='请求失败';try{let x=await r.json();msg=x.message||x.detail||msg}catch{}throw Error(msg)}if(r.headers.get('content-type')?.includes('text/csv'))return r.blob();return r.status===204?null:r.json()}
const formData=f=>Object.fromEntries(new FormData(f).entries());
async function boot(){try{let x=await api('/api/auth/me');if(x.authenticated){me=x;csrf=x.csrf;showApp()}}catch{}}
$('#loginForm').onsubmit=async e=>{e.preventDefault();try{let f=formData(e.target);let x=await api('/api/auth/login',{method:'POST',body:JSON.stringify(f)});me=x;csrf=x.csrf;$('#loginMsg').textContent='';showApp()}catch(err){$('#loginMsg').textContent=err.message}};
$('#logout').onclick=async()=>{try{await api('/api/auth/logout',{method:'POST'})}finally{me=null;csrf='';location.reload()}};
function showApp(){if(!me)return;$('#loginView').classList.add('hidden');$('#app').classList.remove('hidden');$('#logout').classList.remove('hidden');$('#who').textContent=me.displayName+'（'+({ADMIN:'管理员',STAFF:'器材管理员',BORROWER:'借用人'}[me.role])+'）';let items=[['dashboard','总览'],['equipment','器材管理'],['loans','借还管理']];if(me.role!=='BORROWER')items.push(['inventory','库存盘点'],['repairs','维修管理']);if(me.role==='ADMIN')items.push(['users','用户权限'],['categories','分类管理']);$('#nav').innerHTML=items.map((x,i)=>`<button data-view="${x[0]}" class="${i===0?'on':''}">${x[1]}</button>`).join('');$('#nav').onclick=e=>{let b=e.target.closest('button[data-view]');if(!b)return;document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.view').forEach(x=>x.classList.toggle('hidden',x.id!==b.dataset.view));loadView(b.dataset.view)};loadView('dashboard')}
async function loadView(v){try{if(v==='dashboard')await dashboard();if(v==='equipment')await equipmentPage();if(v==='loans')await loansPage();if(v==='inventory')await inventoryPage();if(v==='repairs')await repairsPage();if(v==='users')await usersPage();if(v==='categories')await categoriesPage()}catch(e){alert(e.message)}}
async function getEquipment(){equipment=await api('/api/equipment');categories=await api('/api/categories');return equipment}
async function dashboard(){let x=await api('/api/reports/summary').catch(()=>null);$('#dashboard').innerHTML=x?`<div class="card"><h2>库存概览</h2><div class="stats">${[['器材种类',x.equipmentKinds],['器材总数',x.totalQuantity],['当前可用',x.availableQuantity],['借出记录',x.activeLoans],['待维修',x.openRepairs]].map(a=>`<div class="stat">${a[0]}<b>${a[1]}</b></div>`).join('')}</div><p><button id="exportCsv" class="primary">导出器材 CSV</button></p></div>`:`<div class="card"><h2>欢迎，${esc(me.displayName)}</h2><p>可查询器材并提交借用申请。</p></div>`;$('#exportCsv')?.addEventListener('click',async()=>{let b=await api('/api/reports/equipment.csv');let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='equipment.csv';a.click();URL.revokeObjectURL(a.href)})}
async function equipmentPage(){let rows=await getEquipment();let admin=me.role!=='BORROWER';$('#equipment').innerHTML=`${admin?`<div class="card"><h2>登记 / 修改器材</h2><form id="eqForm" class="grid"><input name="code" placeholder="编号（留空自动生成）"><input name="name" placeholder="器材名称 *" required><select name="categoryId"><option value="">选择分类</option>${categories.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><input name="specification" placeholder="规格型号"><input name="quantity" type="number" min="0" value="1" required><input name="location" placeholder="存放位置"><input name="notes" placeholder="备注"><button class="primary">新增器材</button></form><div id="eqMsg" class="msg"></div></div>`:''}<div class="card"><h2>器材库存</h2><input id="eqSearch" placeholder="搜索编号、名称或分类"><div class="tablewrap"><table><thead><tr><th>编号</th><th>名称</th><th>分类</th><th>规格</th><th>库存</th><th>可借</th><th>位置</th>${admin?'<th>操作</th>':''}</tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.code)}</td><td>${esc(x.name)}</td><td>${esc(x.category)}</td><td>${esc(x.specification)}</td><td>${x.total_quantity}</td><td>${x.available_quantity}</td><td>${esc(x.location)}</td>${admin?`<td><button data-edit="${x.id}">编辑</button></td>`:''}</tr>`).join('')}</tbody></table></div></div>`;
$('#eqSearch').oninput=async e=>{let r=await api('/api/equipment?q='+encodeURIComponent(e.target.value));$('#equipment tbody').innerHTML=r.map(x=>`<tr><td>${esc(x.code)}</td><td>${esc(x.name)}</td><td>${esc(x.category)}</td><td>${esc(x.specification)}</td><td>${x.total_quantity}</td><td>${x.available_quantity}</td><td>${esc(x.location)}</td>${admin?`<td><button data-edit="${x.id}">编辑</button></td>`:''}</tr>`).join('')};
$('#eqForm')?.addEventListener('submit',async e=>{e.preventDefault();let f=formData(e.target);try{await api('/api/equipment',{method:'POST',body:JSON.stringify({...f,categoryId:Number(f.categoryId)||null,quantity:Number(f.quantity)})});$('#eqMsg').textContent='登记成功';equipmentPage()}catch(err){$('#eqMsg').textContent=err.message}});
$('#equipment').onclick=async e=>{let b=e.target.closest('[data-edit]');if(!b)return;let x=rows.find(y=>y.id===Number(b.dataset.edit));let name=prompt('器材名称',x.name);if(name===null)return;let qty=Number(prompt('总数（需不小于借出/维修数）',x.total_quantity));try{await api('/api/equipment/'+x.id,{method:'PUT',body:JSON.stringify({code:x.code,name,categoryId:x.category_id, specification:x.specification,quantity:qty,location:x.location,notes:x.notes})});equipmentPage()}catch(err){alert(err.message)}}}
async function loansPage(){let [eq,rows]=await Promise.all([api('/api/equipment'),api('/api/loans')]);$('#loans').innerHTML=`<div class="card"><h2>借出登记</h2><form id="borrowForm" class="grid"><select name="equipmentId" required><option value="">选择器材</option>${eq.map(x=>`<option value="${x.id}">${esc(x.name)}（可借 ${x.available_quantity}）</option>`).join('')}</select>${me.role==='BORROWER'?'':`<input name="borrowerName" placeholder="借用人备注（实际账号为当前用户）">`}<input name="quantity" type="number" min="1" value="1" required><input name="purpose" placeholder="用途"><input name="dueAt" type="date"><button class="primary">确认借出</button></form><p class="muted">借用人账号将作为借用记录责任人。</p></div><div class="card"><h2>借还记录</h2><div class="tablewrap"><table><thead><tr><th>器材</th><th>借用人</th><th>数量</th><th>用途</th><th>借出时间</th><th>应还日期</th><th>状态</th><th>操作</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.equipment_name)}</td><td>${esc(x.borrower)}</td><td>${x.quantity}</td><td>${esc(x.purpose)}</td><td>${esc(x.borrowed_at)}</td><td>${esc(x.due_at)}</td><td>${x.status==='BORROWED'?'借出中':'已归还'}</td><td>${x.status==='BORROWED'?`<button data-return="${x.id}">归还</button>`:'—'}</td></tr>`).join('')}</tbody></table></div></div>`;
$('#borrowForm').onsubmit=async e=>{e.preventDefault();let f=formData(e.target);try{await api('/api/loans',{method:'POST',body:JSON.stringify({equipmentId:Number(f.equipmentId),quantity:Number(f.quantity),purpose:f.purpose,dueAt:f.dueAt})});loansPage()}catch(err){alert(err.message)}};$('#loans').onclick=async e=>{let b=e.target.closest('[data-return]');if(b)try{await api('/api/loans/'+b.dataset.return+'/return',{method:'POST'});loansPage()}catch(err){alert(err.message)}}}
async function inventoryPage(){let [eq,rows]=await Promise.all([api('/api/equipment'),api('/api/inventory')]);$('#inventory').innerHTML=`<div class="card"><h2>库存盘点</h2><form id="invForm" class="grid"><select name="equipmentId" required><option value="">选择器材</option>${eq.map(x=>`<option value="${x.id}">${esc(x.name)}（账面 ${x.total_quantity}）</option>`).join('')}</select><input name="actualQuantity" type="number" min="0" placeholder="实盘总数" required><input name="note" placeholder="盘点说明"><button class="primary">保存盘点并调整库存</button></form></div><div class="card"><h2>盘点记录</h2>${table(['编号','名称','账面数','实盘数','差异','盘点人','时间','备注'],rows.map(x=>[x.code,x.name,x.expected_quantity,x.actual_quantity,x.difference,x.checker,x.checked_at,x.note]))}</div>`;$('#invForm').onsubmit=async e=>{e.preventDefault();let f=formData(e.target);try{await api('/api/inventory',{method:'POST',body:JSON.stringify({equipmentId:Number(f.equipmentId),actualQuantity:Number(f.actualQuantity),note:f.note})});inventoryPage()}catch(err){alert(err.message)}}}
async function repairsPage(){let [eq,rows]=await Promise.all([api('/api/equipment'),api('/api/repairs')]);$('#repairs').innerHTML=`<div class="card"><h2>登记损坏 / 维修</h2><form id="repairForm" class="grid"><select name="equipmentId" required><option value="">选择器材</option>${eq.map(x=>`<option value="${x.id}">${esc(x.name)}（可用 ${x.available_quantity}）</option>`).join('')}</select><input name="quantity" type="number" min="1" value="1" required><input name="issue" placeholder="故障描述" required><button class="primary">登记并移出可用库存</button></form></div><div class="card"><h2>维修记录</h2><div class="tablewrap"><table><thead><tr><th>器材</th><th>数量</th><th>问题</th><th>登记人</th><th>状态</th><th>时间</th><th>处理</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.equipment_name)}</td><td>${x.quantity}</td><td>${esc(x.issue)}</td><td>${esc(x.reporter)}</td><td>${x.status==='OPEN'?'待维修':'已完成'}</td><td>${esc(x.created_at)}</td><td>${x.status==='OPEN'?`<button data-resolve="${x.id}">维修完成</button>`:'—'}</td></tr>`).join('')}</tbody></table></div></div>`;$('#repairForm').onsubmit=async e=>{e.preventDefault();let f=formData(e.target);try{await api('/api/repairs',{method:'POST',body:JSON.stringify({equipmentId:Number(f.equipmentId),quantity:Number(f.quantity),issue:f.issue})});repairsPage()}catch(err){alert(err.message)}};$('#repairs').onclick=async e=>{let b=e.target.closest('[data-resolve]');if(b)try{await api('/api/repairs/'+b.dataset.resolve+'/resolve',{method:'POST'});repairsPage()}catch(err){alert(err.message)}}}
function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
async function usersPage(){let rows=await api('/api/users');$('#users').innerHTML=`<div class="card"><h2>新增用户</h2><form id="userForm" class="grid"><input name="username" placeholder="登录账号" required><input name="displayName" placeholder="姓名" required><input name="password" type="password" minlength="8" placeholder="初始密码（至少8位）" required><select name="role"><option value="BORROWER">普通借用人</option><option value="STAFF">器材管理员</option><option value="ADMIN">系统管理员</option></select><button class="primary">创建账号</button></form></div><div class="card"><h2>账号与权限</h2><div class="tablewrap"><table><thead><tr><th>账号</th><th>姓名</th><th>角色</th><th>状态</th><th>操作</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.username)}</td><td>${esc(x.display_name)}</td><td>${esc(x.role)}</td><td>${x.enabled?'启用':'停用'}</td><td><button data-user="${x.id}" data-enabled="${x.enabled}">切换启用</button></td></tr>`).join('')}</tbody></table></div><p class="muted">修改密码请停用/启用功能之外通过用户编辑 API 更新；为保护账号，界面不展示密码。</p></div>`;$('#userForm').onsubmit=async e=>{e.preventDefault();let f=formData(e.target);try{await api('/api/users',{method:'POST',body:JSON.stringify({...f,enabled:true})});usersPage()}catch(err){alert(err.message)}};$('#users').onclick=async e=>{let b=e.target.closest('[data-user]');if(!b)return;let x=rows.find(u=>u.id===Number(b.dataset.user));try{await api('/api/users/'+x.id,{method:'PUT',body:JSON.stringify({displayName:x.display_name,role:x.role,enabled:!x.enabled})});usersPage()}catch(err){alert(err.message)}}}
async function categoriesPage(){let rows=await api('/api/categories');$('#categories').innerHTML=`<div class="card"><h2>分类管理</h2><form id="catForm" class="grid"><input name="name" placeholder="分类名称" required><input name="description" placeholder="说明"><button class="primary">新增分类</button></form></div><div class="card">${table(['分类','说明'],rows.map(x=>[x.name,x.description]))}</div>`;$('#catForm').onsubmit=async e=>{e.preventDefault();let f=formData(e.target);try{await api('/api/categories',{method:'POST',body:JSON.stringify(f)});categoriesPage()}catch(err){alert(err.message)}}}
boot();
</script></body></html>
